name: Bug report
description: Report a reproducible problem in Blox7
title: "[Bug]: "
labels:
  - bug
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Please include enough detail for someone else to reproduce the bug.

        Please write issues and pull requests yourself. Do not use AI-generated text.

  - type: input
    id: version
    attributes:
      label: Blox7 version
      description: The release version or the commit hash.
      placeholder: "For example: 0.1 (About tab) or 1a2b3c4"
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: System information
      description: Include your Windows version, GPU, and graphics driver.
      placeholder: "For example: Windows 7 SP1, NVIDIA GeForce GTX 1060, driver 474.44"
    validations:
      required: true

  - type: input
    id: installation
    attributes:
      label: Installation method
      description: Tell us how Blox7 was installed or built.
      placeholder: "For example: the Blox7.exe release, or built from source"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence of actions that triggers the problem.
      placeholder: |
        1. Start Blox7 with ...
        2. Open ...
        3. Select ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what you expected to happen instead.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Latest log: Settings > About > Open the logs folder, or
        `%LOCALAPPDATA%\Blox7\data\root\.local\state\blox7\logs\latest.log`

        Older logs are in the `sessions` folder next to `latest.log`.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the relevant part of latest.log.
      render: text

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, videos, workarounds, or any other useful details.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
